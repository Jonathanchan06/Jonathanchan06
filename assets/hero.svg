<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Jonathan Chan - CS + Math at UofT, ML, full-stack">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#33ff66" opacity="0.035"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace; }
      .code  { font-size: 13px; }
      .addr  { fill: #ffb000; }
      .bytes { fill: #4f6b57; }
      .mn    { fill: #33ff66; font-weight: 700; }
      .op    { fill: #c8ffd4; }
      .cmt   { fill: #4a5a4e; font-style: italic; }
      .lbl   { fill: #00e5ff; }
      .dim   { fill: #3a4a3e; }
      .title { fill: #6f8a76; font-size: 11px; letter-spacing: 2px; }

      /* boot: lines reveal one by one */
      .ln { opacity: 0; animation: reveal .05s linear forwards; }
      @keyframes reveal { to { opacity: 1; } }

      /* instruction pointer steps through the 7 listed instructions */
      .rip { opacity: 0; animation: show .01s linear 2.6s forwards; }
      .rip-move { animation: step 5.6s steps(7, end) 2.6s infinite; }
      @keyframes step { from { transform: translateY(0); } to { transform: translateY(154px); } }
      @keyframes show { to { opacity: 1; } }

      /* RIP register value synced to the pointer */
      .ripv { opacity: 0; animation: tick 5.6s linear infinite; }
      @keyframes tick { 0%, 14.2% { opacity: 1; } 14.3%, 100% { opacity: 0; } }

      .blink { animation: blink 1s steps(1, end) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .25; } }

      .g1, .g2 { opacity: 0; }
      .g1 { animation: glitch1 4s linear infinite; }
      .g2 { animation: glitch2 4s linear infinite; }
      @keyframes glitch1 {
        0%, 88%, 100% { opacity: 0; transform: translate(0,0); }
        89% { opacity: .8; transform: translate(-3px, 1px); }
        91% { opacity: .8; transform: translate(2px, -1px); }
        93% { opacity: 0; }
      }
      @keyframes glitch2 {
        0%, 88%, 100% { opacity: 0; transform: translate(0,0); }
        89% { opacity: .8; transform: translate(3px, -1px); }
        91% { opacity: .8; transform: translate(-2px, 1px); }
        93% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="900" height="440" rx="10" fill="#070a08"/>
  <rect width="900" height="440" rx="10" fill="url(#scan)"/>

  <!-- top bar -->
  <rect x="1" y="1" width="898" height="30" rx="9" fill="#0d130f"/>
  <rect x="1" y="22" width="898" height="9" fill="#0d130f"/>
  <line x1="0" y1="31" x2="900" y2="31" stroke="#1b2a1f"/>
  <text x="18" y="21" class="code" fill="#6f8a76">(gdb) <tspan fill="#c8ffd4">run</tspan> <tspan fill="#4f6b57">./jonathanchan06.elf</tspan></text>
  <text x="650" y="21" class="code" fill="#4f6b57">x86-64</text>
  <circle cx="730" cy="16.5" r="4" fill="#33ff66" class="pulse"/>
  <text x="742" y="21" class="code" fill="#33ff66">RUNNING</text>

  <!-- header -->
  <text x="30" y="62" class="code cmt">; ===== global _start ===================================</text>
  <g filter="url(#glow)">
    <text x="30" y="108" font-size="44" font-weight="800" fill="#33ff66" letter-spacing="4">JONATHAN CHAN</text>
  </g>
  <text x="30" y="108" font-size="44" font-weight="800" fill="#ff2b6a" letter-spacing="4" class="g1">JONATHAN CHAN</text>
  <text x="30" y="108" font-size="44" font-weight="800" fill="#00e5ff" letter-spacing="4" class="g2">JONATHAN CHAN</text>
  <text x="30" y="136" class="code"><tspan class="cmt">; </tspan><tspan fill="#c8ffd4">cs + math @ uoft</tspan><tspan class="dim"> :: </tspan><tspan fill="#c8ffd4">ml</tspan><tspan class="dim"> :: </tspan><tspan fill="#c8ffd4">full-stack</tspan> <tspan fill="#33ff66" class="blink">█</tspan></text>

  <!-- ===== disassembly pane ===== -->
  <rect x="20" y="156" width="620" height="196" rx="4" fill="#0a0f0b" stroke="#1b2a1f"/>
  <text x="32" y="174" class="title">DISASSEMBLY  &lt;_start&gt;</text>

  <!-- instruction pointer highlight -->
  <g class="rip">
    <g class="rip-move">
      <rect x="22" y="184" width="616" height="20" fill="#33ff66" opacity="0.09"/>
      <rect x="22" y="184" width="2" height="20" fill="#33ff66"/>
      <text x="28" y="198" class="code" fill="#33ff66">▶</text>
    </g>
  </g>

  <g class="code">
    <g class="ln" style="animation-delay:.3s">
      <text x="44" y="198" class="addr">00401000</text><text x="130" y="198" class="bytes">48 31 c0</text>
      <text x="300" y="198" class="mn">xor</text><text x="350" y="198" class="op">rax, rax</text><text x="500" y="198" class="cmt">; boot</text>
    </g>
    <g class="ln" style="animation-delay:.6s">
      <text x="44" y="220" class="addr">00401003</text><text x="130" y="220" class="bytes">48 8d 35 f6 0f 00 00</text>
      <text x="300" y="220" class="mn">lea</text><text x="350" y="220" class="op">rsi, [rel <tspan class="lbl">whoami</tspan>]</text>
    </g>
    <g class="ln" style="animation-delay:.9s">
      <text x="44" y="242" class="addr">0040100a</text><text x="130" y="242" class="bytes">e8 21 00 00 00</text>
      <text x="300" y="242" class="mn">call</text><text x="350" y="242" class="lbl">train_models</text><text x="500" y="242" class="cmt">; xgboost</text>
    </g>
    <g class="ln" style="animation-delay:1.2s">
      <text x="44" y="264" class="addr">0040100f</text><text x="130" y="264" class="bytes">e8 3c 00 00 00</text>
      <text x="300" y="264" class="mn">call</text><text x="350" y="264" class="lbl">ship_fullstack</text><text x="500" y="264" class="cmt">; react+api</text>
    </g>
    <g class="ln" style="animation-delay:1.5s">
      <text x="44" y="286" class="addr">00401014</text><text x="130" y="286" class="bytes">e8 57 00 00 00</text>
      <text x="300" y="286" class="mn">call</text><text x="350" y="286" class="lbl">run_local_llms</text><text x="500" y="286" class="cmt">; midas</text>
    </g>
    <g class="ln" style="animation-delay:1.8s">
      <text x="44" y="308" class="addr">00401019</text><text x="130" y="308" class="bytes">48 ff c0</text>
      <text x="300" y="308" class="mn">inc</text><text x="350" y="308" class="op">rax</text><text x="500" y="308" class="cmt">; ++xp</text>
    </g>
    <g class="ln" style="animation-delay:2.1s">
      <text x="44" y="330" class="addr">0040101c</text><text x="130" y="330" class="bytes">eb e2</text>
      <text x="300" y="330" class="mn">jmp</text><text x="350" y="330" class="op">0x401000</text><text x="500" y="330" class="cmt">; forever</text>
    </g>
  </g>

  <!-- ===== registers pane ===== -->
  <rect x="652" y="156" width="228" height="196" rx="4" fill="#0a0f0b" stroke="#1b2a1f"/>
  <text x="664" y="174" class="title">REGISTERS</text>
  <g class="code">
    <text x="664" y="198" fill="#00e5ff">rax</text><text x="700" y="198" class="op">0x0000000000000539</text>
    <text x="664" y="218" fill="#00e5ff">rbx</text><text x="700" y="218" class="op">0x000000000000cafe</text>
    <text x="664" y="238" fill="#00e5ff">rsi</text><text x="700" y="238" class="op">0x0000000000402000</text>
    <text x="664" y="258" fill="#00e5ff">rbp</text><text x="700" y="258" class="op">0x00007ffcdeadbeef</text>
    <text x="664" y="278" fill="#00e5ff">rsp</text><text x="700" y="278" class="op">0x00007ffcc0ffee00</text>
    <text x="664" y="298"><tspan fill="#ffb000">rip</tspan></text>
    <g fill="#ffb000">
      <text x="700" y="298" class="ripv" style="animation-delay:2.6s">0x0000000000401000</text>
      <text x="700" y="298" class="ripv" style="animation-delay:3.4s">0x0000000000401003</text>
      <text x="700" y="298" class="ripv" style="animation-delay:4.2s">0x000000000040100a</text>
      <text x="700" y="298" class="ripv" style="animation-delay:5.0s">0x000000000040100f</text>
      <text x="700" y="298" class="ripv" style="animation-delay:5.8s">0x0000000000401014</text>
      <text x="700" y="298" class="ripv" style="animation-delay:6.6s">0x0000000000401019</text>
      <text x="700" y="298" class="ripv" style="animation-delay:7.4s">0x000000000040101c</text>
    </g>
    <line x1="664" y1="312" x2="868" y2="312" stroke="#1b2a1f"/>
    <text x="664" y="334"><tspan class="dim">eflags</tspan> <tspan fill="#33ff66">[ ZF IF ]</tspan></text>
  </g>

  <!-- ===== memory dump ===== -->
  <rect x="20" y="364" width="860" height="62" rx="4" fill="#0a0f0b" stroke="#1b2a1f"/>
  <text x="32" y="381" class="title">MEMORY  x/32xb $rsi  &lt;whoami&gt;</text>
  <g class="code">
    <g class="ln" style="animation-delay:2.4s">
      <text x="44" y="400" class="addr">00402000</text>
      <text x="130" y="400" class="op">48 69 2c 20 49 27 6d 20  4a 6f 6e 61 74 68 61 6e</text>
      <text x="560" y="400"><tspan class="dim">|</tspan><tspan fill="#33ff66">Hi, I'm Jonathan</tspan><tspan class="dim">|</tspan></text>
    </g>
    <g class="ln" style="animation-delay:2.6s">
      <text x="44" y="418" class="addr">00402010</text>
      <text x="130" y="418" class="op">20 43 68 61 6e 2e 20 57  65 6c 63 6f 6d 65 21 0a</text>
      <text x="560" y="418"><tspan class="dim">|</tspan><tspan fill="#33ff66" xml:space="preserve"> Chan. Welcome!.</tspan><tspan class="dim">|</tspan></text>
    </g>
  </g>

  <!-- CRT finish -->
  <rect width="900" height="440" rx="10" fill="url(#vignette)" pointer-events="none"/>
  <rect x="0.5" y="0.5" width="899" height="439" rx="10" fill="none" stroke="#1b2a1f"/>
</svg>
