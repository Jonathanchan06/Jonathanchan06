<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="exit(0)">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace; font-size: 13px; }
      .addr { fill: #ffb000; } .mn { fill: #33ff66; font-weight: 700; } .op { fill: #c8ffd4; } .cmt { fill: #4a5a4e; font-style: italic; }
      .blink { animation: blink 1s steps(1, end) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="900" height="64" rx="8" fill="#070a08" stroke="#1b2a1f"/>
  <text x="24" y="38"><tspan class="addr">0040103a</tspan></text>
  <text x="110" y="38"><tspan class="mn">mov</tspan> <tspan class="op">eax, 60</tspan></text>
  <text x="250" y="38"><tspan class="mn">xor</tspan> <tspan class="op">edi, edi</tspan></text>
  <text x="400" y="38"><tspan class="mn">syscall</tspan></text>
  <text x="490" y="38" class="cmt">; exit(0) -- thanks for reading</text>
  <rect x="760" y="27" width="8" height="14" fill="#33ff66" class="blink"/>
</svg>
